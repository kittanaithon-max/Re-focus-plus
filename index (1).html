<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re:focus Plus</title>
<meta name="theme-color" content="#F7F9FC">
<script>try{if(JSON.parse(localStorage.getItem('rf_amber')))document.documentElement.setAttribute('data-amber','1')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#5B8DEF;--pd:#3F6FD1;--soft:#EAF2FF;--soft2:#DCE8FF;--bg:#F7F9FC;--w:#fff;--tx:#27364B;--tx2:#7B8798;--ok:#4CAF87;--okbg:#E5F5EE;--warn:#E8A33D;--warnbg:#FFF4E0;--err:#D9605C;--errbg:#FDECEB;--line:#E3EAF4;--ink:#14203A;--sh:0 2px 10px rgba(39,54,75,.07);--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:'Prompt','Noto Sans Thai',sans-serif;margin:0;color:var(--ink);line-height:1.3}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0 0 8px}
button{font-family:inherit;font-size:15px;cursor:pointer}
.brand{font-family:'Prompt',sans-serif;font-weight:600;font-size:24px;letter-spacing:-.2px;white-space:nowrap}
.brand b{color:var(--ink);font-weight:600}.brand span{color:var(--p)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--w);color:var(--tx);font-weight:500;transition:.15s;position:relative}
.btn:hover{border-color:var(--p);color:var(--pd)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--p);border-color:var(--p);color:#fff}
.btn.primary:hover{background:var(--pd);border-color:var(--pd);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled,.btn.disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2.5px solid rgba(120,140,170,.4);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}
.btn.primary.loading::after,.btn.ok.loading::after{border-color:rgba(255,255,255,.5);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.btn:focus-visible,.acard:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(91,141,239,.45);outline-offset:2px}

/* layout */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--w);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side .brand{padding:0 10px 18px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:0;background:none;color:var(--tx2);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--soft);color:var(--pd)}
.nav.on{background:var(--soft);color:var(--pd)}
.nav i{font-style:normal;font-size:19px;width:24px;text-align:center}
.side .grow{flex:1}
.planbox{background:var(--soft);border-radius:16px;padding:14px;font-size:14px}
main{padding:28px 32px 48px;max-width:1120px;width:100%;margin:0 auto}
.bottom{display:none}
.card{background:var(--w);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.card h3{margin-bottom:10px}
.muted{color:var(--tx2);font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.hello p{color:var(--tx2);margin-top:4px}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--pd);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.chip.ok{background:var(--okbg);color:#2f8a65}.chip.warn{background:var(--warnbg);color:#a86a10}.chip.gray{background:#EEF1F6;color:var(--tx2)}
.badge{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600}
.badge.free{background:var(--okbg);color:#2f8a65}.badge.premium{background:#FFF1D6;color:#a86a10}
.grid-dash{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.span2{grid-column:1/-1}
.timer-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 22px}
.ringwrap{position:relative;width:240px;height:240px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#t-time{font-family:'Prompt',sans-serif;font-weight:600;font-size:46px;color:var(--ink);font-variant-numeric:tabular-nums}
#t-label{color:var(--tx2);font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.stat{padding:18px}
.stat small{display:block;color:var(--tx2);font-size:13px}
.stat b{display:block;font-family:'Prompt',sans-serif;font-size:24px;color:var(--ink);margin-top:2px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--p);border-radius:99px;transition:width .6s}
.acards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.acard{background:var(--w);border:1.5px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:.15s;color:var(--tx)}
.acard:hover{border-color:var(--p);box-shadow:var(--sh);transform:translateY(-1px)}
.acard.locked{background:#FAFBFD}
.acard .ic{font-size:28px}
.acard b{font-family:'Prompt',sans-serif;font-weight:500;color:var(--ink)}
.acard small{color:var(--tx2);font-size:13px}
.acard .why{color:var(--pd);font-size:12.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters .btn{min-height:36px;padding:0 14px;font-size:14px;border-radius:99px}
.filters .btn.on{background:var(--soft);border-color:var(--p);color:var(--pd)}
.sec{margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.breakpanel{background:linear-gradient(180deg,var(--okbg),#fff);border-color:#cfe8dc}

/* forms */
label.fl{display:block;font-weight:500;margin:14px 0 6px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=email],select,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;background:#fff;color:var(--tx)}
textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;color:var(--tx);transition:.15s}
.opt:hover{border-color:var(--p)}
.opt.on{border-color:var(--p);background:var(--soft);box-shadow:0 0 0 2px rgba(91,141,239,.2)}
.opt.dis{opacity:.55;cursor:not-allowed}
.opt small{display:block;color:var(--tx2);font-size:12.5px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.tog{width:48px;height:28px;border-radius:99px;background:#CBD4E2;border:0;position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--p)}.tog.on::after{left:23px}
.occgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--tx)}
.note.warn{background:var(--warnbg)}.note.err{background:var(--errbg);color:#8d2f2c}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(20,32,58,.45);padding:16px}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 20px 60px rgba(20,32,58,.3);animation:pop .2s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin-bottom:8px}
.mico{font-size:44px;text-align:center}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:70;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(20,32,58,.3);font-size:14.5px;animation:pop .2s}
.toast.err{background:#8d2f2c}.toast.ok{background:#2a7a58}
.toast button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:6px 12px}

/* runner */
#runner{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#runner.open{display:flex}
.run-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.run-top h3{flex:1;text-align:center}
#r-time{font-family:'Prompt',sans-serif;font-weight:600;font-size:20px;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.run-bar{height:6px;background:var(--soft)}.run-bar i{display:block;height:100%;width:0;background:var(--p);transition:width .25s linear}
.run-body{flex:1;overflow:auto;padding:22px 16px;display:flex;justify-content:center}
.run-in{width:100%;max-width:560px}
.run-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#fff;border-top:1px solid var(--line)}
.gstat{text-align:center;color:var(--tx2);margin-bottom:12px;min-height:26px}
.finish{text-align:center;padding-top:20px}
.finish .big{font-size:56px}
.stars{display:flex;gap:6px;justify-content:center;margin:12px 0}
.stars button{font-size:28px;background:none;border:0;opacity:.35;padding:2px}
.stars button.on{opacity:1}
.breath{width:200px;height:200px;margin:6px auto 14px;position:relative;display:flex;align-items:center;justify-content:center}
#b-circle{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#cfe0ff,#9ebcf7);transform:scale(.55)}
#b-text{position:relative;font-family:'Prompt',sans-serif;font-weight:500;color:var(--ink)}
.g-step{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:12px}
.g-step small{color:var(--tx2)}.g-step p{font-size:19px;font-family:'Prompt',sans-serif;margin:4px 0 0}
.g-list{padding-left:22px;color:var(--tx2);font-size:14.5px}.g-list li.cur{color:var(--ink);font-weight:600}.g-list li.done{text-decoration:line-through;opacity:.6}
.safety{background:var(--warnbg);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
/* games */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{aspect-ratio:1;border:0;border-radius:16px;background:var(--soft2);font-size:30px;color:var(--p);transition:.2s}
.mcard.up{background:#fff;border:2px solid var(--p)}.mcard.ok{background:var(--okbg);border:2px solid var(--ok);opacity:.85}
.seqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:340px;margin:0 auto}
.seqgrid button{aspect-ratio:1;border:0;border-radius:20px;background:var(--soft2)}
.seqgrid button.lit{background:var(--p);box-shadow:0 0 0 4px rgba(91,141,239,.3)}
.cword{font-family:'Prompt',sans-serif;font-size:54px;font-weight:700;text-align:center;margin:10px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts .opt{text-align:center;font-weight:500}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--err);background:var(--errbg)}
.oddgrid{display:grid;gap:6px;max-width:380px;margin:0 auto}
.oddgrid button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:26px;padding:0}
.ordgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.ordgrid button{aspect-ratio:1.2;border:0;border-radius:16px;background:var(--soft2);font-family:'Prompt',sans-serif;font-size:26px;font-weight:600;color:var(--ink)}
.ordgrid button.got{background:var(--okbg);color:#2f8a65;opacity:.6}.ordgrid button.bad{background:var(--errbg)}
.qtxt{font-family:'Prompt',sans-serif;font-size:21px;text-align:center;margin:8px 0 18px;color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.tile{border:1.5px solid var(--p);background:var(--soft);border-radius:12px;padding:8px 14px;font-size:17px}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt.sel{border-color:var(--p);background:var(--soft)}.pairs .opt.done{opacity:.35;pointer-events:none}
.moods{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.moods button{font-size:34px;border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px}.moods button.on{border-color:var(--p);background:var(--soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.shake{animation:shake .25s}

/* report */
.cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}.hbar i{display:block;height:100%;background:var(--p)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.lock{position:relative;filter:grayscale(.2)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.plans ul{padding-left:20px;margin:10px 0;color:var(--tx)}
.plans .cur{border:2px solid var(--p)}
.hero{max-width:640px;margin:0 auto;padding:36px 18px}
.center{text-align:center}

@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{display:none}
 main{padding:18px 16px 110px}
 .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottom button{border:0;background:none;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;font-size:12px;min-height:52px;border-radius:12px}
 .bottom button i{font-style:normal;font-size:21px}.bottom button.on{color:var(--pd);background:var(--soft)}
 .grid-dash{grid-template-columns:1fr}
 .acards{grid-template-columns:1fr}
 .plans{grid-template-columns:1fr}
 h1{font-size:23px}
 .ringwrap{width:220px;height:220px}#t-time{font-size:40px}
 #toasts{bottom:96px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Plus: ปุ่มใหญ่ขึ้น + ระยะห่างโปร่งขึ้น ===== */
:root{--gap:26px}
.btn{min-height:54px;padding:0 26px;font-size:16.5px;border-radius:16px}
.btn.sm{min-height:46px;padding:0 18px;font-size:15px;border-radius:14px}
.btn.xl{min-height:66px;font-size:19px;width:100%;border-radius:18px}
.filters{gap:12px;margin:18px 0}
.filters .btn{min-height:46px;padding:0 18px;font-size:15px}
.opt{padding:16px 18px;min-height:58px;border-radius:16px}
.nav{padding:15px 16px;font-size:16px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input[type=email],select,textarea{min-height:54px;font-size:16px;border-radius:14px}
.tog{width:58px;height:34px}.tog::after{width:26px;height:26px;top:4px;left:4px}.tog.on::after{left:28px}
.switch{padding:16px 0;gap:16px}
.card{padding:26px}
.grid-dash{gap:28px}.stats{gap:20px}.acards{gap:22px}.occgrid{gap:14px}.seg{gap:14px}
.acard{padding:20px;gap:8px;border-radius:18px}
.stat{padding:22px}
.actions{gap:14px}
.mbtns{gap:14px;margin-top:22px}
.sec{margin:36px 0 16px}
.stars{gap:10px}.stars button{font-size:34px;min-width:52px;min-height:52px}
.moods{gap:14px}.moods button{font-size:38px;padding:12px 16px;min-width:64px;min-height:64px}
.hello{margin-bottom:26px}
.hello,#view>h1{padding-right:176px}
.run-foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));gap:12px}
.run-top{gap:12px;padding:16px}
.memgrid{gap:14px}.opts{gap:14px}.pairs{gap:14px}
.qtxt{margin:12px 0 22px}
@media (max-width:900px){
 :root{--gap:30px}
 main{padding:22px 18px 140px}
 .bottom button{min-height:64px;font-size:12.5px;padding:8px 2px;gap:2px}
 .bottom button i{font-size:23px}
 .grid-dash{gap:30px}.stats{gap:18px}.acards{gap:22px}
 .card{padding:22px}
 .btn{width:auto}
 .actions .btn,.mbtns .btn{flex:1 1 100%}
 .hello,#view>h1{padding-right:64px}
 #toasts{bottom:104px}
}

/* ===== Plus: โหมดถนอมสายตา (Amber) ===== */
#amber-btn{position:fixed;top:12px;right:12px;z-index:60;display:flex;align-items:center;gap:8px;min-height:50px;min-width:50px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--w);color:var(--tx);font-weight:500;box-shadow:var(--sh);justify-content:center}
#amber-btn .ai{font-size:22px}
#amber-btn[aria-pressed=true]{background:#FFE2B8;border-color:#E39A45;color:#6B3F0A}
@media (max-width:900px){#amber-btn{padding:0;width:50px}#amber-btn .al{display:none}}
#amber-veil{position:fixed;inset:0;z-index:9999;pointer-events:none;display:none;background:rgba(255,150,30,.17);mix-blend-mode:multiply}
html[data-amber] #amber-veil{display:block}
html[data-amber]{--bg:#FFF2DE;--w:#FFF9EF;--tx:#3A2915;--tx2:#7E6446;--ink:#2B1C0B;--line:#EBD3AE;--p:#D9822B;--pd:#A65A12;--soft:#FFE8C7;--soft2:#FFD9A3;--okbg:#EDF3DD;--warnbg:#FFEBC4;--errbg:#FBE3D5}
html[data-amber] .chip.gray{background:#F6E6CC}
html[data-amber] .btn.primary{color:#fff}
html[data-amber] .opt,html[data-amber] .acard,html[data-amber] .mbox,html[data-amber] .run-top,html[data-amber] .run-foot,html[data-amber] .bottom,html[data-amber] .g-step{background:var(--w)}
html[data-amber] .side{background:var(--w)}

/* ===== Plus: Quick Timer ===== */
.quick{width:100%;margin-top:6px}
.quick small.t{display:block;color:var(--tx2);margin-bottom:12px;font-size:14px}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:92px;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--w);color:var(--tx);transition:.15s}
.qbtn:hover{border-color:var(--p)}.qbtn:active{transform:scale(.98)}
.qbtn span{font-size:28px}.qbtn b{font-family:'Prompt',sans-serif;font-weight:500;color:var(--ink);font-size:17px}.qbtn small{color:var(--tx2);font-size:13.5px;line-height:1.4}
@media (max-width:600px){.qrow{grid-template-columns:1fr}}
.tmode{min-height:22px;color:var(--pd);font-weight:500;font-size:14.5px}

/* ===== Plus: หน้าเริ่มกิจกรรม ===== */
.intro{text-align:center;padding-top:8px}
.intro .big{font-size:68px;line-height:1.1}
.intro h2{margin:8px 0 6px}
.intro .meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.intro ol{text-align:left;color:var(--tx);font-size:16.5px;line-height:1.75;padding-left:26px;margin:14px 0}
.intro .safety{text-align:left}
.pre [data-act=runRestart]{visibility:hidden}

/* ===== Plus: Quick Relief + Ambient ===== */
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.rcard{border:1.5px solid var(--line);border-radius:20px;padding:22px;background:var(--w);display:flex;flex-direction:column;gap:12px}
.rcard .ri{font-size:42px;line-height:1}
.rcard h3{font-size:19px;margin:0}
.rcard ol{margin:0;padding-left:24px;font-size:17.5px;line-height:1.85;color:var(--tx)}
.rcard .rt{color:var(--tx2);font-size:15px}
@media (max-width:900px){.rcards{grid-template-columns:1fr;gap:22px}}
.qr-text{font-family:'Prompt',sans-serif;font-size:24px;line-height:1.5;text-align:center;margin:10px 0;color:var(--ink)}
.qr-time{font-family:'Prompt',sans-serif;font-weight:600;font-size:52px;text-align:center;color:var(--pd);font-variant-numeric:tabular-nums}
.amb{border:1.5px solid var(--line);border-radius:20px;padding:20px;margin-top:18px;background:var(--w)}
.amb.on{border-color:var(--ok);background:linear-gradient(180deg,var(--okbg),var(--w))}
.amb-head{display:flex;align-items:center;gap:14px}
.amb-icon{font-size:38px}
.amb-head>div{flex:1;min-width:0}
.amb-state{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600;background:#EEF1F6;color:var(--tx2);white-space:nowrap}
.amb-state.on{background:var(--ok);color:#fff}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq s{display:block;width:3px;background:#fff;border-radius:2px;animation:eq 0.9s ease-in-out infinite}
.eq s:nth-child(2){animation-delay:.2s}.eq s:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.amb-ctl{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.amb-btn{min-width:170px}
.amb-vol{display:flex;align-items:center;gap:12px;flex:1;min-width:210px}
.amb-spk{font-size:26px;width:34px;text-align:center}
input[type=range].rng{-webkit-appearance:none;appearance:none;flex:1;min-width:120px;height:12px;border-radius:99px;background:var(--soft2);outline:none;padding:0;border:0;min-height:0}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--p);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
input[type=range].rng::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--p);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.amb-v{min-width:48px;text-align:right;font-weight:600}
.rmini{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.rmini .tx{flex:1;min-width:200px}
</style>
</head>
<body>
<div id="root"></div>
<button id="amber-btn" type="button" data-act="amber" aria-pressed="false" aria-label="โหมดถนอมสายตา (สีส้มนวล ลดแสงสีฟ้า)"><span class="ai" aria-hidden="true">🌙</span><span class="al">ถนอมสายตา</span></button>
<div id="amber-veil" aria-hidden="true"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="runner"></div>
<div id="toasts" aria-live="polite"></div>

<script>if(!(window.google&&google.script&&google.script.run))document.write('<script src="config.js"><\/script>');</script>
<script>
/* =====================================================================
 * Re:focus — Frontend
 * ===================================================================== */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(Math.floor(n)).padStart(2, '0');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '');
const fmtClock = sec => { sec = Math.max(0, Math.ceil(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s); };
const fmtDur = sec => { const m = Math.round(sec / 60); if (m < 60) return m + ' นาที'; const h = Math.floor(m / 60); return h + ' ชม.' + (m % 60 ? ' ' + (m % 60) + ' นาที' : ''); };
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] ?? null) : JSON.parse(v); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { } }
};

const A = {
  auth: store.get('rf_auth'), profile: null, planDef: null, settings: null, plans: null, occs: [], activities: [], recommended: [],
  session: null, today: null, offset: 0, view: 'dashboard', report: null, filter: 'all', adminKey: '', adminData: null,
  prefs: Object.assign({ sound: true, notify: false, quiet: false, quietFrom: '22:00', quietTo: '07:00' }, store.get('rf_prefs') || {}),
  P: store.get('rf_phase') || { key: '', extra: 0, postponed: 0, alerted: false }, titleAlert: '', Q: store.get('rf_quick'), amber: !!store.get('rf_amber')
};
const au = () => ({ userId: A.auth.userId, token: A.auth.token });
const nowMs = () => Date.now() + A.offset;
const occOf = k => A.occs.find(o => o.key === k) || { key: k, label: k, icon: '🌿', en: '' };
const ICON = { move: '🤸', mind: '🌬️', game: '🎮', eyes: '👀', breathe: '🌬️', walk: '🚶', stretch: '🙆', relax: '😌', observe: '👁️', rest: '😴', quiet: '🔇', creative: '✏️', memory: '🃏', sequence: '🔢', color: '🎨', odd: '🔍', order: '🔢', logic: '🧩', wordlink: '🔗', wordorder: '📝', quiz: '❓', vocab: '📖', recall: '🧠', reflect: '💭' };
const CAT = { move: 'Move & Stretch', mind: 'Mind Reset', game: 'Mini Games' };

/* ---------- server calls ---------- */
// เปิดผ่านหน้า Web App ของ Google → ใช้ google.script.run
// โฮสต์หน้านี้เองนอก Google (GitHub Pages / Netlify) → วาง Web App URL (ลงท้าย /exec) ที่นี่
const API_URL = window.__API_URL__ || '';
const IN_GAS = !!(window.google && google.script && google.script.run);
function rpcDone(r, resolve, reject) {
  if (r && r.serverNow) A.offset = r.serverNow - Date.now();
  if (r && r.ok === false) reject(Object.assign(new Error(r.error || 'เกิดข้อผิดพลาด'), { code: r.code })); else resolve(r);
}
function rpc(name, ...args) {
  return new Promise((resolve, reject) => {
    if (IN_GAS) {
      google.script.run
        .withSuccessHandler(r => rpcDone(r, resolve, reject))
        .withFailureHandler(err => reject(Object.assign(new Error((err && err.message) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'), { code: 'NET' })))
      [name](...args);
      return;
    }
    if (!API_URL) { reject(Object.assign(new Error('ยังไม่ได้ตั้งค่า API_URL — วาง Web App URL ของ Apps Script ที่ต้นสคริปต์ใน index.html'), { code: 'NOGAS' })); return; }
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 60000);
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: name, args }), redirect: 'follow', signal: ctl.signal })
      .then(r => r.text())
      .then(t => {
        let r; try { r = JSON.parse(t); } catch (e) { throw Object.assign(new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง — ตรวจสอบว่า Deploy เป็น Web App แบบ Who has access: Anyone และใช้ URL ที่ลงท้าย /exec'), { code: 'NET' }); }
        rpcDone(r, resolve, reject);
      })
      .catch(e => reject(typeof e.code === 'string' ? e : Object.assign(new Error(e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป กรุณาลองอีกครั้ง' : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง'), { code: 'NET' })))
      .finally(() => clearTimeout(to));
  });
}
let SW_READY = false;
if (!IN_GAS && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { SW_READY = true; }).catch(() => { });
function fail(e) {
  if (e && e.code === 'AUTH') { store.del('rf_auth'); A.auth = null; toast(e.message, { type: 'err' }); boot(); return; }
  toast(e && e.message ? e.message : 'เกิดข้อผิดพลาด', { type: 'err' });
}
async function run(btn, fn) {
  if (btn && (btn.disabled || btn.classList.contains('loading'))) return;
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  try { await fn(); } catch (e) { fail(e); } finally { if (btn) { btn.classList.remove('loading'); btn.disabled = false; } }
}

/* ---------- toast / modal ---------- */
function toast(msg, o = {}) {
  const el = document.createElement('div'); el.className = 'toast ' + (o.type || '');
  el.innerHTML = `<span>${esc(msg)}</span>${o.action ? `<button>${esc(o.label || 'ลองอีกครั้ง')}</button>` : ''}`;
  if (o.action) $('button', el).onclick = () => { el.remove(); o.action(); };
  $('#toasts').appendChild(el);
  if (!o.sticky) setTimeout(() => el.remove(), o.ms || 5200);
  return el;
}
function openModal(html) { const m = $('#modal'); m.innerHTML = `<div class="mbox">${html}</div>`; m.classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; A.titleAlert = ''; }

/* =====================================================================
 * Timer model — คำนวณจาก timestamp ของ Server ทุกครั้ง
 * ===================================================================== */
function quickActive() { return !!(A.Q && A.session && A.Q.sessionId === A.session.sessionId); }
function cfg() {
  if (quickActive()) return { w: A.Q.w, b: A.Q.b };
  const s = A.settings, p = A.profile; let w = s.standardWorkMin, b = s.standardBreakMin;
  if (p.mode === 'long') { w = s.longWorkMin; b = s.longBreakMin; }
  else if (p.mode === 'custom' && A.planDef.allowCustomTimer) { w = p.customWorkMin; b = p.customBreakMin; }
  return { w, b };
}
const phaseType = s => (s.status === 'paused' ? (s.prevStatus || 'working') : s.status) === 'break' ? 'break' : 'working';
function live() {
  const s = A.session; if (!s) return null;
  let e = s.status === 'working' || s.status === 'break' ? Math.max(0, (nowMs() - s.segmentStartMs) / 1000) : 0;
  return { w: s.workSec + (s.status === 'working' ? e : 0), b: s.breakSec + (s.status === 'break' ? e : 0), p: s.phaseSec + e, e };
}
function syncPhase() {
  const s = A.session; if (!s) return;
  const key = [s.sessionId, s.cycles, s.breakCount, phaseType(s)].join(':');
  if (A.P.key !== key) { A.P = { key, extra: 0, postponed: 0, alerted: false }; store.set('rf_phase', A.P); }
}
function savePhase() { store.set('rf_phase', A.P); }
function applySession(r) {
  const s = r.session;
  A.pet = null;
  A.session = s && (s.status === 'working' || s.status === 'paused' || s.status === 'break') ? s : null;
  if (A.Q && (!A.session || A.session.sessionId !== A.Q.sessionId)) { A.Q = null; store.del('rf_quick'); }
  if (r.today) A.today = r.today;
  if (A.session) syncPhase();
}

/* =====================================================================
 * Alerts
 * ===================================================================== */
function isQuiet() {
  if (!A.prefs.quiet) return false;
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), f = A.prefs.quietFrom.split(':').map(Number), t = A.prefs.quietTo.split(':').map(Number);
  const a = f[0] * 60 + f[1], b = t[0] * 60 + t[1];
  return a <= b ? (m >= a && m < b) : (m >= a || m < b);
}
function beep() {
  try {
    const C = new (window.AudioContext || window.webkitAudioContext)();
    [0, .28].forEach((d, i) => { const o = C.createOscillator(), g = C.createGain(); o.frequency.value = i ? 660 : 880; o.connect(g); g.connect(C.destination); const t = C.currentTime + d; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.15, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .24); o.start(t); o.stop(t + .26); });
  } catch (e) { }
}
function notify(title, body) {
  A.titleAlert = '⏰ ' + title;
  if (isQuiet()) return;
  if (A.prefs.sound) beep();
  try {
    if (A.prefs.notify && 'Notification' in window && Notification.permission === 'granted') {
      if (SW_READY) navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, tag: 'refocus', renotify: true })).catch(() => { try { new Notification(title, { body }); } catch (e) { } });
      else new Notification(title, { body });
    }
  } catch (e) { }
}
function logChoice(choice) {
  const p = { clientRequestId: uid(), kind: 'choice', choice, sessionId: A.session ? A.session.sessionId : '' };
  rpc('saveActivityLog', au(), p).catch(e => toast('บันทึกการเลือกไม่สำเร็จ: ' + e.message, { type: 'err', label: 'ลองส่งอีกครั้ง', action: () => rpc('saveActivityLog', au(), p).catch(() => { }) }));
}
function checkAlerts() {
  const s = A.session; if (!s || s.status === 'paused' || R) return;
  syncPhase(); const L = live();
  if (s.status === 'working' && !A.P.alerted && L.p >= cfg().w * 60 + A.P.extra) { A.P.alerted = true; savePhase(); onWorkDue(); }
  else if (s.status === 'break' && !A.P.alerted && L.p >= cfg().b * 60) { A.P.alerted = true; savePhase(); onBreakDue(); }
}
function onWorkDue() {
  const L = live(), left = A.settings.maxPostpones - A.P.postponed;
  notify('ถึงเวลาพักสายตาสักครู่แล้ว', 'ทำงานต่อเนื่องมา ' + fmtDur(L.p) + ' แล้ว');
  openModal(`<div class="mico">☕</div><h2 class="center">ถึงเวลาพักสายตาสักครู่แล้ว</h2>
  <p class="center muted">คุณทำงานต่อเนื่องมา ${esc(fmtDur(L.p))} การพักสั้น ๆ ตอนนี้ช่วยให้กลับมาทำงานได้สบายขึ้น</p>
  <div class="mbtns"><button class="btn primary" data-act="takeBreak">พักเลย</button>
  <button class="btn" data-act="postpone" ${left <= 0 ? 'disabled' : ''}>เลื่อนไป ${A.settings.postponeMin} นาที ${left > 0 ? '(เหลือ ' + left + ' ครั้ง)' : '(ครบจำนวนแล้ว)'}</button>
  <button class="btn ghost" data-act="skipRound">ข้ามรอบนี้</button></div>`);
}
function onBreakDue() {
  notify('หมดเวลาพักแล้ว', 'พร้อมกลับไปทำงานต่อหรือยัง?');
  openModal(`<div class="mico">✨</div><h2 class="center">หมดเวลาพักแล้ว</h2><p class="center muted">พร้อมกลับไปทำงานต่อหรือยัง?</p>
  <div class="mbtns"><button class="btn primary" data-act="backToWork">กลับไปทำงาน</button><button class="btn ghost" data-act="closeModal">ขอพักต่ออีกสักครู่</button></div>`);
}

/* =====================================================================
 * Boot / onboarding
 * ===================================================================== */
function applyInit(r) {
  A.occs = r.occupations; A.plans = r.plans; A.settings = r.settings;
  if (r.profile) {
    A.profile = r.profile; A.planDef = r.planDef; A.activities = r.activities; A.recommended = r.recommended;
    A.session = r.session && ['working', 'paused', 'break'].includes(r.session.status) ? r.session : null; A.today = r.today; syncPhase();
    if (A.Q && (!A.session || A.session.sessionId !== A.Q.sessionId)) { A.Q = null; store.del('rf_quick'); }
  }
}
async function boot() {
  $('#root').innerHTML = `<div class="hero center"><div class="brand" style="font-size:34px"><b>Re:</b><span>focus</span></div><p class="muted" style="margin-top:18px">กำลังเตรียมพื้นที่ทำงานของคุณ…</p></div>`;
  try {
    const r = await rpc('getInitialData', A.auth ? au() : null);
    applyInit(r);
    if (r.needsRegister || !A.auth) { renderOnboarding(); return; }
    renderShell(); go(A.view);
    startTick();
  } catch (e) {
    if (e.code === 'AUTH') { store.del('rf_auth'); A.auth = null; return boot(); }
    $('#root').innerHTML = `<div class="hero center"><div class="brand" style="font-size:34px"><b>Re:</b><span>focus</span></div>
      <div class="note err" style="margin:22px 0;text-align:left"><b>เปิดระบบไม่สำเร็จ</b><br>${esc(e.message)}</div>
      <button class="btn primary" onclick="boot()">ลองอีกครั้ง</button></div>`;
  }
}
function renderOnboarding() {
  const free = A.plans.Free.allowedOccupations;
  const okOcc = o => free === 'ALL' || free.includes(o.key);
  $('#root').innerHTML = `<div class="hero">
   <div class="center"><div class="brand" style="font-size:38px"><b>Re:</b><span>focus</span></div>
   <h1 style="margin-top:12px">พักให้ตรงจุด แล้วกลับไปโฟกัสได้ดีขึ้น</h1>
   <p class="muted">จับเวลาทำงาน เตือนให้พัก และเลือกกิจกรรมพักที่เหมาะกับสายงานของคุณ</p></div>
   <div class="card" style="margin-top:22px"><h3>1) คุณทำงานสายไหน?</h3>
   <div class="occgrid" id="ob-occ">${A.occs.map(o => `<button class="opt ${okOcc(o) ? '' : 'dis'}" data-act="obPick" data-k="${o.key}" ${okOcc(o) ? '' : 'aria-disabled="true"'}>${o.icon} <b>${esc(o.label)}</b><small>${okOcc(o) ? '&nbsp;' : '🔒 ใช้ได้กับ Premium'}</small></button>`).join('')}</div>
   <p class="muted" style="margin-top:10px">เปลี่ยนสายงานภายหลังได้ที่หน้าตั้งค่า</p>
   <h3 style="margin-top:18px">2) ความเป็นส่วนตัว</h3>
   <div class="note">Re:focus เก็บเฉพาะข้อมูลที่จำเป็น: สายงาน เวลาทำงาน/พัก กิจกรรมที่ทำ และคำตอบแบบประเมิน โดยใช้รหัสผู้ใช้แบบสุ่ม ไม่ต้องใช้ชื่อหรืออีเมล ข้อมูลใช้เพื่อปรับปรุงผลิตภัณฑ์เท่านั้น และไม่แสดงข้อมูลรายบุคคลในรายงานสาธารณะ</div>
   <div class="mbtns"><button class="btn primary" id="ob-go" data-act="obStart" disabled>เริ่มใช้ Re:focus</button></div></div>
   <div class="card" style="margin-top:var(--gap)"><h3>มีรหัสบัญชีสำรองอยู่แล้ว?</h3><div class="row"><input type="text" id="ob-code" placeholder="วางรหัสบัญชีสำรองที่นี่" style="flex:1;min-width:200px"><button class="btn" data-act="obRestore">กู้คืนบัญชี</button></div></div>
  </div>`;
  A.obOcc = '';
}

/* =====================================================================
 * Shell & navigation
 * ===================================================================== */
const NAV = [['dashboard', '🏠', 'หน้าหลัก'], ['break', '🧘', 'กิจกรรมพัก'], ['relax', '🌿', 'ผ่อนคลาย'], ['pet', '🐾', 'สัตว์เลี้ยง'], ['report', '📊', 'รายงาน'], ['settings', '⚙️', 'ตั้งค่า']];
function renderShell() {
  $('#root').innerHTML = `<div class="shell"><aside class="side"><div class="brand"><b>Re:</b><span>focus</span> <small style="font-size:12px;font-weight:600;color:var(--pd);background:var(--soft);border-radius:8px;padding:2px 8px;vertical-align:middle">PLUS</small></div>
   ${NAV.map(n => `<button class="nav" data-act="nav" data-v="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('')}<div class="grow"></div>
   <div class="planbox" id="planbox"></div></aside>
   <main id="view"></main>

/* ---------- เครื่องมือเสริม: หารบิล (ทำงานในเครื่องผู้ใช้ ไม่ส่งข้อมูลไปเซิร์ฟเวอร์) ---------- */
const BILL0 = () => ({ mode: 'equal', total: '', n: 2, svc: 0, vat: false, round: true, items: [{ name: '', amt: '' }, { name: '', amt: '' }] });
function billCalc() {
  const b = A.bill, mult = (1 + b.svc / 100) * (b.vat ? 1.07 : 1), fx = x => (b.round ? Math.ceil(x - 1e-9) : Math.round(x * 100) / 100) + 0;
  if (b.mode === 'equal') {
    const base = Math.max(0, +b.total || 0), n = Math.max(1, Math.floor(+b.n) || 1), grand = base * mult;
    return { base, grand, per: fx(grand / n), n, paid: fx(grand / n) * n };
  }
  const rows = b.items.map(it => ({ name: it.name, base: Math.max(0, +it.amt || 0) }));
  rows.forEach(r => r.pay = fx(r.base * mult));
  const base = rows.reduce((a, r) => a + r.base, 0);
  return { rows, base, grand: base * mult, paid: rows.reduce((a, r) => a + r.pay, 0) };
}
const baht = x => (Math.round(x * 100) / 100).toLocaleString('th-TH', { maximumFractionDigits: 2 });
function vBill() {
  if (!A.bill) A.bill = BILL0();

  <div class="card" style="margin-top:var(--gap)">
   <div class="seg"><button class="opt ${on(b.mode === 'equal')}" data-act="billSet" data-k="mode" data-v="equal"><b>หารเท่ากัน</b><small>ทุกคนจ่ายเท่ากัน</small></button>
   <button class="opt ${on(b.mode === 'items')}" data-act="billSet" data-k="mode" data-v="items"><b>แยกตามที่สั่ง</b><small>ใครสั่งอะไรจ่ายตามนั้น</small></button></div>
   ${b.mode === 'equal' ? `<div class="row"><div style="flex:2;min-width:150px"><label class="fl" for="bl-total">ยอดรวมในบิล (บาท)</label><input type="number" id="bl-total" inputmode="decimal" min="0" step="any" value="${esc(b.total)}" data-in="bill" data-k="total"></div>
     <div style="flex:1;min-width:110px"><label class="fl" for="bl-n">จำนวนคน</label><input type="number" id="bl-n" inputmode="numeric" min="1" max="99" step="1" value="${b.n}" data-in="bill" data-k="n"></div></div>`
    : `<div id="bl-items">${b.items.map((it, i) => `<div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="text" aria-label="ชื่อคนที่ ${i + 1}" placeholder="ชื่อ (เช่น เอ)" maxlength="30" value="${esc(it.name)}" data-in="bill" data-i="${i}" data-f="name" style="flex:2;min-width:0"><input type="number" aria-label="ยอดของคนที่ ${i + 1} (บาท)" placeholder="บาท" inputmode="decimal" min="0" step="any" value="${esc(it.amt)}" data-in="bill" data-i="${i}" data-f="amt" style="flex:1;min-width:0"><button class="btn sm ghost" data-act="billDel" data-i="${i}" aria-label="ลบรายการที่ ${i + 1}" ${b.items.length <= 1 ? 'disabled' : ''}>✕</button></div>`).join('')}</div>
     <div class="mbtns"><button class="btn sm" data-act="billAdd" ${b.items.length >= 20 ? 'disabled' : ''}>+ เพิ่มคน</button></div>`}
   <label class="fl">ค่าบริการ (Service charge)</label>
   <div class="filters">${[0, 5, 10].map(v => `<button class="btn ${on(b.svc === v)}" data-act="billSet" data-k="svc" data-v="${v}">${v === 0 ? 'ไม่มี' : v + '%'}</button>`).join('')}</div>
   <div class="switch"><div><b>บวก VAT 7%</b></div><button class="tog ${on(b.vat)}" data-act="billSet" data-k="vat" data-v="${!b.vat}" role="switch" aria-checked="${b.vat}" aria-label="บวก VAT 7%"></button></div>
   <div class="switch"><div><b>ปัดขึ้นเป็นบาทเต็ม</b><br><span class="muted">จ่ายง่ายขึ้น ไม่ต้องทอนเศษสตางค์</span></div><button class="tog ${on(b.round)}" data-act="billSet" data-k="round" data-v="${!b.round}" role="switch" aria-checked="${b.round}" aria-label="ปัดขึ้นเป็นบาทเต็ม"></button></div>
  </div>
  <div class="card" style="margin-top:var(--gap)" aria-live="polite"><div id="bill-out"></div>
   <div class="mbtns"><button class="btn" data-act="billCopy">คัดลอกผลลัพธ์</button> <button class="btn ghost" data-act="billReset">ล้างทั้งหมด</button></div></div>`;
}
function billText() {
  const r = billCalc(), b = A.bill;
  if (b.mode === 'equal') return `หารบิล: ยอดรวมหลังค่าบริการ/VAT ${baht(r.grand)} บาท หาร ${r.n} คน = คนละ ${baht(r.per)} บาท`;
  return 'หารบิล (ยอดรวม ' + baht(r.grand) + ' บาท)\n' + r.rows.map((x, i) => `${x.name.trim() || 'คนที่ ' + (i + 1)}: ${baht(x.pay)} บาท`).join('\n');

function paintBill() {
  const o = $('#bill-out'); if (!o) return;
  const r = billCalc(), b = A.bill, extra = r.grand - r.base;
  const note = `<p class="muted" style="margin-top:10px">ยอดก่อนบวก ${baht(r.base)} บาท${extra > 0.004 ? ` + ค่าบริการ/VAT ${baht(extra)} บาท` : ''} = ${baht(r.grand)} บาท${b.round && r.paid - r.grand > 0.004 ? ` · เศษที่ปัดขึ้นรวม ${baht(r.paid - r.grand)} บาท` : ''}</p>`;
  o.innerHTML = b.mode === 'equal'
    ? `<div class="muted">แต่ละคนจ่าย</div><div style="font-family:Prompt,sans-serif;font-size:40px;font-weight:700;color:var(--pd);line-height:1.2">${baht(r.per)} <span style="font-size:18px">บาท</span></div>${note}`
    : `<div class="muted">แต่ละคนจ่าย</div>${r.rows.map((x, i) => `<div class="switch"><div><b>${esc(x.name.trim() || 'คนที่ ' + (i + 1))}</b></div><div style="font-family:Prompt,sans-serif;font-weight:600;font-size:20px">${baht(x.pay)} บาท</div></div>`).join('')}${note}`;

/* ---------- สัตว์เลี้ยงเสมือน (Virtual Pet) — แต้มและอารมณ์คำนวณที่เซิร์ฟเวอร์จากข้อมูลจริง ---------- */

    : `<circle cx="81" cy="92" r="7" fill="#27364B"/><circle cx="119" cy="92" r="7" fill="#27364B"/><circle cx="83" cy="89" r="2.2" fill="#fff"/><circle cx="121" cy="89" r="2.2" fill="#fff"/>`;

    : `<path d="M70 44l8-22 10 20 12-24 12 24 10-20 8 22z" fill="${P.dark}" stroke="${P.dark}" stroke-width="3" stroke-linejoin="round"/>`;

function petMoodText(m) { return m === 'happy' ? 'อารมณ์ดี 😊' : m === 'tired' ? 'เหนื่อยนิดหน่อย 😴' : 'ปกติ 🙂'; }

/* =====================================================================
 * Plus 4) Ambient Sound — เสียงธรรมชาติสังเคราะห์ด้วย WebAudio (ไม่ต้องโหลดไฟล์เสียง)

const AMB_DEFS = [
  { id: 'rain', icon: '🌧️', name: 'เสียงฝน', desc: 'ฝนตกเบา ๆ', cap: .55 },

  { id: 'wind', icon: '🍃', name: 'สายลม', desc: 'ลมพัดผ่านต้นไม้', cap: .75 },

function ambEnsure() {

    const c = AMB.ctx = new C(); AMB.master = c.createGain(); AMB.master.gain.value = .9; AMB.master.connect(c.destination);
    const len = c.sampleRate * 4, mk = type => { const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0); let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; if (type === 'white') d[i] = w; else { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; } } return b; };

  return true;
}
function ambBuild(id) {

  const osc = (type, f) => { const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.start(); srcs.push(o); return o; };
  const filt = (type, f, q) => { const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; };
  const amp = v => { const g = c.createGain(); g.gain.value = v; return g; };
  if (id === 'rain') {
    const n = noise('white'), hp = filt('highpass', 800), lp = filt('lowpass', 9000), g = amp(.32); n.connect(hp); hp.connect(lp); lp.connect(g); g.connect(out);
    const n2 = noise('white'), bp = filt('bandpass', 3200, .6), g2 = amp(.18), l = osc('sine', .23), lg = amp(.08); n2.connect(bp); bp.connect(g2); g2.connect(out); l.connect(lg); lg.connect(g2.gain);
  } else if (id === 'waves') {
    const n = noise('brown'), lp = filt('lowpass', 900), g = amp(.55), l = osc('sine', .11), lg = amp(.45); n.connect(lp); lp.connect(g); g.connect(out); l.connect(lg); lg.connect(g.gain);
    const n2 = noise('white'), hp = filt('highpass', 2500), g2 = amp(.05), l2 = osc('sine', .11), lg2 = amp(.05); n2.connect(hp); hp.connect(g2); g2.connect(out); l2.connect(lg2); lg2.connect(g2.gain);
  } else if (id === 'wind') {
    const n = noise('white'), bp = filt('bandpass', 520, .9), g = amp(.45), l = osc('sine', .07), lg = amp(260), l2 = osc('sine', .13), lg2 = amp(.25);
    n.connect(bp); bp.connect(g); g.connect(out); l.connect(lg); lg.connect(bp.frequency); l2.connect(lg2); lg2.connect(g.gain);
  } else if (id === 'stream') {
    const n = noise('white'), bp = filt('bandpass', 2300, 1.4), hp = filt('highpass', 900), g = amp(.38), l = osc('sine', .9), lg = amp(500); n.connect(bp); bp.connect(hp); hp.connect(g); g.connect(out); l.connect(lg); lg.connect(bp.frequency);
    const n2 = noise('brown'), lp = filt('lowpass', 500), g2 = amp(.22); n2.connect(lp); lp.connect(g2); g2.connect(out);

function ambGain(id) { const d = AMB_DEFS.find(x => x.id === id), v = AMB.vol[id] || 0; return v * v * d.cap; }

  <p class="center">${yes ? 'ดีใจที่วันนี้ช่วยให้คุณกลับมาโฟกัสได้ พรุ่งนี้เราจะช่วยเตือนให้พักอีกครั้ง' : 'ขอบคุณที่บอกเรา — บางวันก็ไม่ได้ผลเท่าที่หวัง และไม่ใช่ความผิดของคุณเลย เราจะนำเหตุผลนี้ไปปรับปรุง'}</p>
  ${r.workMinutes !== undefined ? `<div class="cards4" style="margin-top:12px"><div class="note center"><b>${r.workMinutes}</b> นาที<br><small>ทำงานวันนี้</small></div><div class="note center"><b>${r.breakCount}</b> ครั้ง<br><small>พักวันนี้</small></div></div>` : ''}

async function loadReport() {
  const el = $('#rep'); if (!el) return;
  if (A.report) { paintReport(); return; }
  try { A.report = await rpc('getDailySummary', au()); paintReport(); }
  catch (e) { el.innerHTML = `<div class="note err">โหลดรายงานไม่สำเร็จ: ${esc(e.message)}</div><button class="btn" style="margin-top:10px" onclick="loadReport()">ลองอีกครั้ง</button>`; if (e.code === 'AUTH') fail(e); }
}
function vReport() { return `<h1>รายงาน</h1><p class="muted">สรุปการทำงานและการพักของคุณ (เก็บย้อนหลังตามแพ็กเกจ: ${A.planDef.maxHistoryDays} วัน)</p><div id="rep"><p class="muted">กำลังโหลด…</p></div>`; }
function paintReport() {
  const r = A.report, t = r.today, el = $('#rep'); if (!el) return;
  const days = r.series.slice(-14), max = Math.max(60, ...days.map(d => d.workMin));
  const W = 600, H = 190, bw = days.length ? Math.min(34, (W - 20) / days.length - 8) : 20;
  const chart = days.length ? `<svg viewBox="0 0 ${W} ${H + 30}" style="width:100%;height:auto;max-height:250px" role="img" aria-label="เวลาทำงานรายวัน">${days.map((d, i) => {
    const x = 14 + i * ((W - 20) / days.length), h = d.workMin / max * H, col = d.answer === 'Yes' ? '#4CAF87' : d.answer === 'No' ? '#E8A33D' : '#5B8DEF';
    return `<rect x="${x}" y="${H - h}" width="${bw}" height="${Math.max(2, h)}" rx="6" fill="${col}"><title>${d.day}: ทำงาน ${d.workMin} นาที</title></rect><text x="${x + bw / 2}" y="${H + 16}" text-anchor="middle" font-size="11" fill="#7B8798">${d.day.slice(8)}/${d.day.slice(5, 7)}</text>`;
  }).join('')}<line x1="8" y1="${H}" x2="${W}" y2="${H}" stroke="#E3EAF4"/></svg>
  <div class="row muted" style="font-size:13px"><span><span style="color:#4CAF87">■</span> วันที่ตอบ “ใช่”</span><span><span style="color:#E8A33D">■</span> วันที่ตอบ “ไม่”</span><span><span style="color:#5B8DEF">■</span> ยังไม่ได้ประเมิน</span></div>` : '<p class="muted">ยังไม่มีข้อมูล เริ่มงานสักรอบเพื่อดูกราฟ</p>';
  const tr = r.trend;
  el.innerHTML = `<div class="cards4" style="margin-top:var(--gap)">
   <div class="card stat"><small>เวลาทำงานวันนี้</small><b>${fmtDur(t.workSec)}</b></div><div class="card stat"><small>เวลาพักรวม</small><b>${fmtDur(t.breakSec)}</b></div>
   <div class="card stat"><small>รอบการทำงาน</small><b>${t.cycles}</b></div><div class="card stat"><small>จำนวนครั้งที่พัก</small><b>${t.breakCount}</b></div></div>
   <div class="card" style="margin-top:var(--gap)"><h3>เวลาทำงานรายวัน (นาที)</h3>${chart}</div>
   <div class="card" style="margin-top:var(--gap)"><h3>กิจกรรมที่ใช้บ่อย</h3>${r.topActivities.length ? r.topActivities.map(a => `<div class="rrow"><span>${esc(a.name)}</span><b>${a.count} ครั้ง</b></div>`).join('') : '<p class="muted">ยังไม่มีกิจกรรมที่ทำจนจบ</p>'}</div>
   <div class="card" style="margin-top:var(--gap)"><h3>รูปแบบการพักของคุณ</h3><div class="rrow"><span>สายงาน</span><b>${esc(occOf(A.profile.occupation).label)}</b></div><div class="rrow"><span>โหมดเวลา</span><b>${{ standard: 'มาตรฐาน', long: 'ช่วงยาว', custom: 'กำหนดเอง' }[A.profile.mode]} (${cfg().w}/${cfg().b} นาที)</b></div><div class="rrow"><span>ประเมินวันนี้</span><b>${r.todayFeedback === 'Yes' ? '✅ ช่วยให้โฟกัส' : r.todayFeedback === 'No' ? '❌ ยังไม่ช่วย' : 'ยังไม่ได้ประเมิน'}</b></div></div>
   <div class="card ${r.trendLocked ? 'lock' : ''}" style="margin-top:var(--gap)"><h3>แนวโน้ม: วันที่โฟกัสดีขึ้น เทียบกับวันที่ยังไม่ดีขึ้น ${r.trendLocked ? '<span class="badge premium">Premium</span>' : ''}</h3>
   ${r.trendLocked ? '<p class="muted">รายงานแนวโน้มอยู่ในแพ็กเกจ Premium</p><button class="btn sm" data-act="goPlan">ดูรายละเอียดแพ็กเกจ</button>' : (tr && (tr.yesDays + tr.noDays) ? `<table><tr><th></th><th>วันที่ตอบ “ใช่” (${tr.yesDays} วัน)</th><th>วันที่ตอบ “ไม่” (${tr.noDays} วัน)</th></tr><tr><td>เวลาทำงานเฉลี่ย</td><td>${tr.yesAvgWork ?? '—'} นาที</td><td>${tr.noAvgWork ?? '—'} นาที</td></tr><tr><td>จำนวนพักเฉลี่ย</td><td>${tr.yesAvgBreaks ?? '—'} ครั้ง</td><td>${tr.noAvgBreaks ?? '—'} ครั้ง</td></tr></table><p class="muted" style="margin-top:8px">${esc(tr.note)}</p>` : '<p class="muted">ยังมีข้อมูลการประเมินไม่พอ ตอบแบบประเมินปลายวันสักสองสามวันเพื่อดูแนวโน้ม</p>')}</div>
   <div class="row" style="margin-top:var(--gap)"><button class="btn" data-act="openFeedback">ประเมินวันนี้</button></div>`;

  <div class="card" style="margin-top:var(--gap)"><h3>เหตุผลเมื่อตอบ “ไม่”</h3>${d.reasons.length ? d.reasons.map(r => `<div class="rrow" style="align-items:center"><span style="min-width:150px">${esc(r.reason)}</span><div class="hbar"><i style="width:${r.count / mx * 100}%"></i></div><b>${r.count}</b></div>`).join('') : '<p class="muted">ไม่มีข้อมูล</p>'}</div>
  <div class="card" style="margin-top:var(--gap)"><h3>แยกตามสายงาน</h3><table><tr><th>สายงาน</th><th>ใช่</th><th>ไม่</th></tr>${d.byOccupation.map(o => `<tr><td>${esc(occOf(o.occupation).label)}</td><td>${o.yes}</td><td>${o.no}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">ไม่มีข้อมูล</td></tr>'}</table></div>
  <div class="card" style="margin-top:var(--gap)"><h3>ข้อความจากผู้ใช้ (ไม่ระบุตัวตน)</h3>${d.comments.map(c => `<div class="rrow"><span>${c.answer === 'Yes' ? '✅' : '❌'} ${esc(c.comment)}</span><span class="muted">${esc(c.day)} · ${esc(occOf(c.occupation).label.split(' ')[0])}</span></div>`).join('') || '<p class="muted">ไม่มีข้อความ</p>'}</div>`;
}

/* =====================================================================
 * Actions (event delegation)
 * ===================================================================== */
const ACT = {
  amber: () => { A.amber = !A.amber; store.set('rf_amber', A.amber); applyAmber(); toast(A.amber ? 'เปิดโหมดถนอมสายตาแล้ว' : 'ปิดโหมดถนอมสายตาแล้ว', { type: 'ok', ms: 1800 }); },
  quick: el => run(el, async () => {
    const q = QUICK.find(x => x.id === el.dataset.id); if (!q) return;
    applySession(await rpc('startWorkSession', au()));
    if (A.session) { A.Q = { sessionId: A.session.sessionId, id: q.id, name: q.name, w: q.w, b: q.b }; store.set('rf_quick', A.Q); }
    lastBtnKey = ''; rerender(); toast('เริ่ม ' + q.name + ' แล้ว', { type: 'ok' });
  }),
  qrStart: el => qrStart(String(el.dataset.ids || '').split(',')),
  qrSkip: () => qrNext(),
  qrStop: () => { stopQr(); closeModal(); },
  ambToggle: el => { ambSet(el.dataset.id, !AMB.on[el.dataset.id]); if (A.view === 'relax') { const y = window.scrollY; rerender(); window.scrollTo(0, y); } },
  ambAll: () => { AMB_DEFS.forEach(d => { if (AMB.on[d.id]) ambSet(d.id, false); }); const y = window.scrollY; rerender(); window.scrollTo(0, y); },
  petReload: () => { A.pet = null; loadPet(); },
  petPick: el => { const n = $('#pet-name'); if (n) A.petNameDraft = n.value; A.petPick = el.dataset.k; paintPet(); },
  petAdopt: el => run(el, async () => {
    const name = ($('#pet-name').value || '').trim(), type = A.petPick || (A.pet && A.pet.petType) || A.profile.petType || 'cat';
    if (!name) { toast('ตั้งชื่อให้สัตว์เลี้ยงก่อนนะ', { type: 'err' }); return; }
    const r = await rpc('saveUserProfile', au(), { petType: type, petName: name }); A.profile = r.profile; A.pet = null; A.petPick = null; A.petNameDraft = undefined;
    toast('บันทึกแล้ว', { type: 'ok' }); await loadPet();
  }),
  billSet: el => { if (!A.bill) A.bill = BILL0(); const k = el.dataset.k, v = el.dataset.v; A.bill[k] = k === 'svc' ? +v : (k === 'vat' || k === 'round') ? v === 'true' : v; rerender(); },
  billAdd: () => { if (A.bill.items.length < 20) A.bill.items.push({ name: '', amt: '' }); rerender(); },
  billDel: el => { if (A.bill.items.length > 1) A.bill.items.splice(+el.dataset.i, 1); rerender(); },
  billReset: () => { A.bill = BILL0(); rerender(); },
  billCopy: () => { const t = billText(); (navigator.clipboard ? navigator.clipboard.writeText(t).then(() => toast('คัดลอกแล้ว', { type: 'ok' })).catch(() => prompt('คัดลอกข้อความนี้', t)) : prompt('คัดลอกข้อความนี้', t)); },
  nav: (el, e) => { e.preventDefault(); go(el.dataset.v); },
  closeModal: () => closeModal(),
  goPlan: () => { closeModal(); go('plan'); },
  goReport: () => { closeModal(); go('report'); },
  goAdmin: () => go('admin'),
  filter: el => { A.filter = el.dataset.v; rerender(); },
  openAct: el => startActivity(el.dataset.id),
  start: el => run(el, async () => { applySession(await rpc('startWorkSession', au())); lastBtnKey = ''; rerender(); }),
  pause: el => run(el, async () => { applySession(await rpc('pauseWorkSession', au(), A.session.sessionId)); lastBtnKey = ''; rerender(); }),
  resume: el => run(el, async () => { applySession(await rpc('resumeWorkSession', au(), A.session.sessionId)); lastBtnKey = ''; rerender(); }),
  takeBreak: el => run(el, async () => { closeModal(); logChoice('take'); applySession(await rpc('beginBreak', au(), A.session.sessionId)); lastBtnKey = ''; go('dashboard'); }),
  backToWork: el => run(el, async () => { closeModal(); applySession(await rpc('endBreak', au(), A.session.sessionId)); logChoice('done'); lastBtnKey = ''; go('dashboard'); }),
  postpone: el => {
    if (A.P.postponed >= A.settings.maxPostpones) return;
    A.P.extra += A.settings.postponeMin * 60; A.P.postponed++; A.P.alerted = false; savePhase(); logChoice('postpone'); closeModal(); toast('เลื่อนการพักไป ' + A.settings.postponeMin + ' นาที'); paintTimer();
  },
  skipRound: el => run(el, async () => { closeModal(); logChoice('skip'); applySession(await rpc('skipBreak', au(), A.session.sessionId)); lastBtnKey = ''; rerender(); }),
  finish: el => openModal(`<div class="mico">🏁</div><h2 class="center">จบงานตอนนี้?</h2><p class="center muted">ระบบจะบันทึกเวลาทำงานและเวลาพักของรอบนี้</p><div class="mbtns"><button class="btn primary" data-act="finishYes">จบงาน</button><button class="btn ghost" data-act="closeModal">ทำต่อ</button></div>`),
  finishYes: el => run(el, async () => {
    const r = await rpc('finishWorkSession', au(), A.session.sessionId); const s = r.session; applySession(r); A.session = null; A.report = null; lastBtnKey = ''; rerender();
    openModal(`<div class="mico">🎉</div><h2 class="center">จบรอบทำงานแล้ว</h2><div class="cards4" style="margin-top:12px"><div class="note center"><b>${fmtDur(s.workSec)}</b><br><small>เวลาทำงาน</small></div><div class="note center"><b>${fmtDur(s.breakSec)}</b><br><small>เวลาพัก</small></div></div><div class="mbtns"><button class="btn primary" data-act="openFeedback">ประเมินวันนี้</button><button class="btn ghost" data-act="closeModal">ปิด</button></div>`);
  }),
  openFeedback: () => openFeedback(),
  fbAns: el => { FB.answer = el.dataset.v; const c = $('#fb-c'); if (c) FB.comment = c.value; renderFbMore(); },
  fbScore: el => { const c = $('#fb-c'); if (c) FB.comment = c.value; FB.score = FB.score === +el.dataset.v ? 0 : +el.dataset.v; renderFbMore(); },
  fbReason: el => { const c = $('#fb-c'); if (c) FB.comment = c.value; const v = el.dataset.v; FB.reasons.has(v) ? FB.reasons.delete(v) : FB.reasons.add(v); renderFbMore(); },
  fbSend: el => sendFeedback(el),
  /* runner */
  rate: el => { R.rating = +el.dataset.v; $$('.stars button').forEach((b, i) => b.classList.toggle('on', i < R.rating)); },
  runRestart: () => { const a = R.act; stopRun(); runActivity(a, true); },
  runBegin: () => beginRun(),
  skipStep: () => { if (R && R.per) R.t0 -= (R.per - ((Date.now() - R.t0) % R.per)) + 5; },
  runExit: () => { if (!R) return; if (R.started && !R.done) { const sec = Math.round((Date.now() - R.t0) / 1000); if (sec >= 5) { R.elapsed = Math.min(sec, R.act.durationSec); saveRunLog(false); } } closeRunner(); rerender(); },
  runAnother: async el => { await saveRunLog(true); closeRunner(); go('break'); },
  runBackToWork: el => run(el, async () => {
    await saveRunLog(true); closeRunner();
    if (A.session && A.session.status === 'break') { applySession(await rpc('endBreak', au(), A.session.sessionId)); logChoice('done'); }
    lastBtnKey = ''; go('dashboard');
  }),
  /* onboarding */
  obPick: el => { if (el.classList.contains('dis')) { toast('สายงานนี้ใช้ได้กับ Premium — เลือกสายงานพื้นฐานก่อน แล้วเปลี่ยนภายหลังได้'); return; } A.obOcc = el.dataset.k; $$('#ob-occ .opt').forEach(b => b.classList.toggle('on', b === el)); $('#ob-go').disabled = false; },
  obStart: el => run(el, async () => { const r = await rpc('registerUser', { occupation: A.obOcc }); A.auth = { userId: r.userId, token: r.token }; store.set('rf_auth', A.auth); await boot(); }),
  obRestore: el => run(el, async () => {
    const code = ($('#ob-code').value || '').trim(), i = code.indexOf('.'); if (i < 1) throw new Error('รหัสไม่ถูกต้อง');
    A.auth = { userId: code.slice(0, i), token: code.slice(i + 1) }; store.set('rf_auth', A.auth); await boot();
  }),
  /* settings */
  setOcc: el => { if (el.classList.contains('dis')) { showUpsell({ name: 'สายงานเพิ่มเติม', description: 'เลือกได้ทุกสายงานและรับกิจกรรมที่ตรงกับสายงานนั้น' }); return; } run(el, async () => { await saveProfile({ occupation: el.dataset.k }, 'เปลี่ยนสายงานแล้ว'); await reloadAll(); rerender(); }); },
  setMode: el => { if (el.classList.contains('dis')) { showUpsell({ name: 'โหมดกำหนดเอง', description: 'ตั้งเวลาทำงานและเวลาพักเองได้' }); return; } run(el, async () => { await saveProfile({ mode: el.dataset.v }, 'เปลี่ยนโหมดแล้ว'); rerender(); }); },
  saveSettings: el => run(el, async () => {
    const patch = { dailyGoalMin: +$('#goal').value };
    if ($('#cw')) { patch.customWorkMin = +$('#cw').value; patch.customBreakMin = +$('#cb').value; }
    await saveProfile(patch, 'บันทึกการตั้งค่าแล้ว'); rerender();
  }),
  saveEmail: el => run(el, async () => { await saveProfile({ email: $('#em').value }, 'บันทึกอีเมลแล้ว'); }),
  tog: el => {
    const id = el.id;
    if (id === 'pf-sound') { A.prefs.sound = !A.prefs.sound; savePrefs(); if (A.prefs.sound) beep(); rerender(); }
    else if (id === 'pf-quiet') { A.prefs.quiet = !A.prefs.quiet; savePrefs(); rerender(); }
    else if (id === 'pf-notify') {
      if (A.prefs.notify) { A.prefs.notify = false; savePrefs(); rerender(); return; }
      if (!('Notification' in window)) { toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน ระบบจะใช้การแจ้งเตือนในหน้าเว็บแทน'); return; }
      if (Notification.permission === 'denied') { toast(IN_GAS ? 'เบราว์เซอร์บล็อกการแจ้งเตือนของหน้านี้ไว้ (หน้า Web App ของ Google ฝังอยู่ใน iframe จึงมักถูกบล็อก) — ระบบใช้หน้าต่างเตือน เสียง และชื่อแท็บกะพริบแทน ให้เปิดแท็บ Re:focus ทิ้งไว้ระหว่างทำงาน' : 'เบราว์เซอร์บล็อกการแจ้งเตือนไว้ — กดไอคอนกุญแจข้างแถบที่อยู่ → การแจ้งเตือน → อนุญาต แล้วรีเฟรชหน้า', { ms: 9000 }); return; }
      openModal(`<div class="mico">🔔</div><h2 class="center">เปิดการแจ้งเตือนของเบราว์เซอร์?</h2><p class="muted center">เราจะขออนุญาตแสดงการแจ้งเตือนเมื่อถึงเวลาพัก โดยจะเตือนเฉพาะตอนที่ Re:focus เปิดอยู่ในเบราว์เซอร์ หากไม่อนุญาต คุณยังได้รับการแจ้งเตือนในหน้าเว็บตามปกติ</p><div class="mbtns"><button class="btn primary" data-act="askNotif">ขออนุญาตแจ้งเตือน</button><button class="btn ghost" data-act="closeModal">ไม่ใช้ตอนนี้</button></div>`);
    }
  },
  askNotif: async () => {
    closeModal();
    try { const p = await Notification.requestPermission(); A.prefs.notify = p === 'granted'; savePrefs(); toast(p === 'granted' ? 'เปิดการแจ้งเตือนแล้ว' : 'ไม่ได้รับอนุญาต — ใช้การแจ้งเตือนในหน้าเว็บแทน', { type: p === 'granted' ? 'ok' : '' }); }
    catch (e) { toast('ขออนุญาตไม่สำเร็จ (บางหน้าฝังอาจบล็อกการแจ้งเตือน) — ใช้การแจ้งเตือนในหน้าเว็บแทน'); }
    rerender();
  },
  copyCode: () => { const t = A.auth.userId + '.' + A.auth.token; (navigator.clipboard ? navigator.clipboard.writeText(t).then(() => toast('คัดลอกแล้ว', { type: 'ok' })).catch(() => prompt('คัดลอกรหัสนี้', t)) : prompt('คัดลอกรหัสนี้', t)); },
  logout: () => { if (confirm('ออกจากอุปกรณ์นี้? หากไม่ได้สำรองรหัสบัญชีไว้ จะกลับมาใช้บัญชีเดิมไม่ได้')) { store.del('rf_auth'); location.reload(); } },
  trial: el => run(el, async () => { await rpc('activatePremiumTrial', au()); await reloadAll(); A.report = null; toast('เริ่มทดลอง Premium แล้ว (ระบบจำลอง ไม่มีการชำระเงิน)', { type: 'ok' }); rerender(); }),
  adminLoad: el => run(el, async () => {
    A.adminKey = $('#ak').value; const f = { from: $('#af').value, to: $('#at').value, occupation: $('#ao').value, plan: $('#ap').value };
    paintAdmin(await rpc('getFeedbackSummary', A.adminKey, f));
  }),
  adminPlan: el => run(el, async () => { A.adminKey = $('#ak').value; const r = await rpc('updateUserPlan', A.adminKey, $('#au-id').value, $('#au-plan').value, +$('#au-days').value || 0); toast('อัปเดตแพ็กเกจของ ' + r.userId + ' แล้ว', { type: 'ok' }); })
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const f = ACT[t.dataset.act]; if (f) f(t, e); });
document.addEventListener('input', e => { const t = e.target; if (!t.dataset || t.dataset.in !== 'bill' || !A.bill) return; if (t.dataset.f) A.bill.items[+t.dataset.i][t.dataset.f] = t.value; else A.bill[t.dataset.k] = t.value; paintBill(); });
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.in === 'quiet') { A.prefs.quietFrom = $('#qf').value || '22:00'; A.prefs.quietTo = $('#qt').value || '07:00'; savePrefs(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal(); });
window.addEventListener('error', ev => { console.error(ev.message); });
applyAmber();
boot();
</script>
</body>
</html>
